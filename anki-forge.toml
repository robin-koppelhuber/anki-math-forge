# anki-forge configuration. One file, all knobs (DESIGN.md ss11).

[repo]
cards_dir = "cards"
sources_dir = "sources"
# Intermediate files: crops, page renders, scratch LaTeX. Disposable,
# gitignored, and the one place a pass is allowed to write working files.
work_dir = ".forge"

[cards]
# DESIGN.md ss15.1 / ss15.2: declared once, mixing is the failure mode.
language = "en"          # prose sections are written in English
front_char_cap = 160     # rendered `## front` length cap, enforced by `check`
# The repo-wide default layout. Which one a book actually uses is a fact about
# that book, so a source may override it; see [sources.matrix-cookbook] below.
layout = "denominator"   # d(scalar)/dX has the shape of X, not X^T

[anki]
url = "http://127.0.0.1:8765"
# The default deck. A source may name its own; two books are two subjects far
# more often than they are one.
deck = "Mathe"                    # DESIGN.md ss15.5
note_type_version = 1
tag_prefix = "forge"

# What you meant by each flag, so `feedback` can turn one keystroke during
# review into a `@claude` note. Anki numbers its flags 1-7 (red, orange,
# green, blue, pink, turquoise, purple); a flag with no entry here is
# reported rather than guessed at. Delete a line to stop importing that flag.
[anki.flags]
1 = "want proof or more detail in existing proof"
2 = "unclear: I could not tell what was being asked"
3 = "too easy or redundant: consider merging or dropping it"
4 = "wants a proof, an example, or a where-this-turns-up line"

[check]
# Extra macros the builtin LaTeX validator should accept beyond its allowlist.
extra_macros = []

[app]
host = "127.0.0.1"
port = 8000
# KaTeX assets. Leave empty and the app serves them from node_modules when
# `npm install katex` has been run, falling back to a CDN. Set a URL or path
# to override.
katex_base = ""

[sources.matrix-cookbook]
title = "The Matrix Cookbook"
deck = "Mathe::Matrix-Calculus"
# The book differentiates in denominator layout. Stated here rather than only
# in conventions.md because `verify` has to act on it: its numerical gradient
# computes one layout, and the two agree on every square matrix, so a mismatch
# would pass review and first bite on a rectangular one.
layout = "denominator"
# Either a .tex file (authoritative) or a .pdf (crops, transcribed later).
# tex wins. Paths are relative to the repo root.
tex = ""
pdf = "sources/matrix-cookbook/matrixcookbook.pdf"
citation = "Matrix Cookbook"
