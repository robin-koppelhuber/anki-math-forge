[project]
name = "anki-math-forge"
version = "0.1.0"
description = "Turn mathematical source material into reviewed Anki cards."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# PDF segmentation. Kept optional: the wheel is chunky and the tex path does not
# need it. NOTE: PyMuPDF is AGPL-3.0 (or commercial) -- fine for a private repo,
# worth knowing before this is ever redistributed.
pdf = ["pymupdf>=1.24"]
# Driving the app in a real browser (`tests/test_graph_browser.py`). Opt-in and
# skipped without it, because it starts a server and launches Chrome, and
# because the rest of the suite needs neither. It uses the Chrome already
# installed rather than downloading one: `assets/make_assets.py` assumes a
# local Chrome too, so this is a pip package and nothing else.
browser = ["playwright>=1.44"]
# Colouring a card's fenced code, at sync. Optional because a missing
# highlighter should cost the colours and not the card: `sync` falls back to
# an uncoloured `<pre>`, which is still correct and readable. Highlighted
# here rather than on the card so nobody you share a deck with needs an
# add-on.
code = ["pygments>=2.17"]
# NOTE: there is deliberately no `ocr` extra. Transcription is a Claude Code
# skill (`/transcribe`) reading crops, not a local vision model -- which is
# what keeps torch, and a 4 GB dependency tree, out of this project entirely.

[project.scripts]
# `forge` is what you type; the long name is kept so a rename does not
# break anybody's muscle memory or scripts.
forge = "anki_math_forge.cli:main"
anki-math-forge = "anki_math_forge.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anki_math_forge"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
strict = true
warn_return_any = false

# Pygments ships no stubs and is optional anyway: `sync` imports it inside a
# `try` and falls back to an uncoloured `<pre>`, so a missing dependency
# costs the colours and not the card.
[[tool.mypy.overrides]]
module = ["pygments.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fitz.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
