# anki-math-forge configuration. One file, all knobs (DESIGN.md ss11).
#
# Tracked deliberately: `cards/` and every `units.jsonl` are committed too, and
# they only mean anything against the settings that produced them.
#
# Four values here are yours, not defaults anybody should inherit. Change these
# and leave the rest alone:
#
#   [anki] deck            which deck in *your* collection new cards land in
#   [anki.flags]           what you meant when you flagged a card mid-review
#   [zotero] units_from    which of your marks start a unit, kind and colour
#   [zotero.meanings]      what your colour scheme means
#
# Every key below is documented in `src/anki_math_forge/config.py`, next to the
# code that reads it. `.env.example` lists the few environment overrides.

[repo]
cards_dir = "cards"
sources_dir = "sources"
work_dir = ".forge"      # crops, page renders, scratch LaTeX. Disposable.

[cards]
language = "en"          # prose sections are written in English
front_char_cap = 160     # rendered `## front` length cap, enforced by `check`
crop_context = 0         # points of page shown around a crop; 0 is the default
crop_width = ""          # `box`, `page`, or empty to let the geometry decide
context_pages = 1        # pages either side handed to whoever writes a card
web = false              # may a card writer look things up? A card should say
                         # what *this source* says.
# Which criterion outranks which when Anki decides what new card you meet next.
# `requires` comes before all of them and the uid settles a tie. The panel
# beside the canvas at `/graph` writes this line.
study_order = ["frequency", "derivation", "printed"]

# No `layout` key here, and no conventions section: a convention is a fact
# about one book, so it lives in that book's `sources/<name>/source.toml`. A
# value left here raises at load rather than being ignored.

[anki]
url = "http://127.0.0.1:8765"
deck = "Mathe"                    # the default; a source may name its own
note_type_name = "Math Card"      # -> "Math Card v1". Change the stem and
note_type_version = 1             # `sync` tells you to rename it in Anki
                                  # rather than orphan your review history.
tag_prefix = "forge"

# What you meant by each flag, so `feedback` can turn one keystroke during
# review into a note. Anki numbers its flags 1-7; a flag with no entry here is
# reported rather than guessed at. Open a meaning with `@me` to have that
# colour come back as a decision for you instead of work for Claude.
[anki.flags]
1 = "want proof or more detail in existing proof"
2 = "unclear: I could not tell what was being asked"
3 = "too easy or redundant: consider merging or dropping it"
4 = "wants a proof, an example, or a where-this-turns-up line"

[check]
extra_macros = []        # beyond the LaTeX validator's allowlist

[app]
host = "127.0.0.1"
port = 8000
katex_base = ""          # empty serves KaTeX from node_modules, else a CDN
graph = true             # the dependency canvas at `/graph`

# Keyboard shortcuts, by action. Defaults and reasoning: `app/keys.py`. Naming
# an action here moves it in the bindings, the footer legend and the guide at
# once; an action that does not exist is an error at load.
#
# A TOML sub-table swallows every bare key below it, so this goes *after* the
# ones above.
#
# [app.keys]
# units:  queue = 'q', queue-with-brief = 'Q', skip = 's', ...
# review: approve = 'a', reject = 'r', back-to-draft = 'u', undo = 'z', ...
# graph:  add-card = '+', every-card = 'f', study-order = 'o', ...

# Reading a marked-up PDF out of Zotero. Needs Zotero running with its local
# API enabled (Settings > Advanced), the way `sync` needs AnkiConnect.
[zotero]
data_dir = "~/Zotero"
# Which marks become units, by the same `"kind/colour"` name the meanings
# below use: a mark is both halves, and a rule that said only `"green"` could
# not tell a green highlight from a green underline. Everything else you
# marked is shown beside the nearest unit. A source may override this list in
# its own file, and an override replaces rather than adds to it.
units_from = ["highlight/green", "note/yellow", "image/yellow"]

# What you meant by each mark. **A key names both halves: `"kind/colour"`**,
# quoted, because a bare TOML key cannot contain a slash. Both halves always: a
# green highlight and a green underline are two marks you made deliberately
# differently. The looser forms are refused at load rather than read generously.
#
# Under whatever you put here sits a built-in reading of Zotero's annotation
# *kinds*, which are the same in every library. So a mark always means
# something, and the views say which of the two it came from.
#
# Zotero's palette: yellow, red, green, blue, purple, magenta, orange, grey.
# Its kinds: highlight, underline, note, image, ink, text. A source overrides
# all of it under `[meanings]` in its own `source.toml`.
[zotero.meanings]
"highlight/green" = "a claim or result"
"highlight/purple" = "a term to know"
"highlight/magenta" = "an observation from the text"
"highlight/blue" = "a named object or method"
"highlight/orange" = "a definition or named algorithm"
"highlight/grey" = "minor, in passing"
"highlight/yellow" = "a citation to follow up"
"underline/orange" = "generic create card annotation"
"note/yellow" = "something I thought while reading"
"image/yellow" = "a figure or table worth a card"

# Sources describe themselves, in `sources/<name>/`: `source.toml` for the keys
# this tool acts on, `conventions.md` for the prose a card writer needs. A
# `[sources.<name>]` block here still works and is read first.
